# Configuration for the workbench application — the bare Filament install the
# package is developed against.
#
# Tests register these providers themselves, through the base TestCase, so this
# file exists for everything that is not a test: `testbench serve`, artisan
# commands, and anything else that has to boot the application the way a host
# would. Without it the panel has no routes at all outside the suite, and the
# first person to try the workbench finds a blank application.

providers:
  - MB\FilamentChatbot\ChatbotServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\WorkbenchPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - APP_NAME="Filament Chatbot Workbench"
  - APP_ENV=local
  # The widget's origin allow-list is built from this, so the demo page can
  # embed the widget. Change the port here if you serve the workbench elsewhere.
  - APP_URL=http://127.0.0.1:8321
  - APP_DEBUG=true
  # A real 32-byte key, not a readable one. The previous placeholder spelled out
  # a sentence in base64 and was 28 bytes, which every command tolerated and the
  # first HTTP request did not: "unsupported cipher or incorrect key length",
  # thrown from the encrypter with nothing to connect it to this line.
  - APP_KEY="base64:M76LD6quSUTfUfCFQcspHN0c23VkEO35Y92L3TkI7B8="
  - DB_CONNECTION=sqlite
  - DB_DATABASE=workbench/database/database.sqlite
  - CACHE_STORE=file
  - QUEUE_CONNECTION=sync
  - SESSION_DRIVER=file
  - MAIL_MAILER=log

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: true
    views: true
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-refresh
  assets:
    - laravel-assets
  sync: []
